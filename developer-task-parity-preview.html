<style>

.chatwrap{height:100%;display:flex;flex-direction:column}.chathead{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px;flex:none}.back{width:30px;height:30px;border:0;border-radius:50%;background:#f2f4f7;cursor:pointer}.chathead .rowcopy strong{font-size:12px}.messages{flex:1;overflow:auto;padding:12px;background:linear-gradient(#f7f8fc,#f3f5fa)}.msg{display:flex;gap:7px;align-items:flex-start;margin-bottom:10px}.msg.me{flex-direction:row-reverse}.msgava{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#fee4e2;color:#b42318;font-size:9px;font-weight:900;flex:none}.msg.me .msgava{background:#eef2ff;color:#4338ca}.bubble{max-width:85%;background:#fff;border:1px solid var(--line);border-radius:6px 15px 15px 15px;padding:9px 10px;box-shadow:0 1px 3px rgba(16,24,40,.04);position:relative}.me .bubble{border-radius:15px 6px 15px 15px;background:#f4f3ff}.bubble.task{border:2px solid #c7d2fe;background:#fff}.bubble.focus{animation:pulse 1.2s ease 2}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.1)}50%{box-shadow:0 0 0 7px rgba(79,70,229,.16)}}.bubblehead{display:flex;align-items:center;justify-content:space-between;gap:10px}.bubblehead strong{font-size:9px}.bubblehead span{font-size:8px;color:#98a2b3}.msgtext{font-size:10.5px;line-height:1.5;margin-top:4px}.dots{border:0;background:none;color:#667085;font-weight:900;cursor:pointer;padding:0 2px}.bubbleactions{display:flex;gap:10px;margin-top:7px;color:#667085}.bubbleactions button{border:0;background:none;color:inherit;font-size:8px;font-weight:900;padding:0;cursor:pointer}.taskstrip{margin-top:8px;border-radius:11px;background:#eef2ff;border:1px solid #c7d2fe;padding:8px}.taskstrip .trow{display:flex;justify-content:space-between;gap:8px;align-items:center}.taskstrip strong{font-size:9px;color:#3730a3}.taskstrip span{font-size:8px;color:#667085}.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padd .overlay{position:absolute;inset:0;background:rgba(16,24,40,.46);z-index:30;display:none}.overlay.on{display:block}.sheet{position:absolute;background:#fff}.phone .sheet{left:0;right:0;bottom:0;max-height:88%;overflow:auto;border-radius:24px 24px 0 0}.tablet .sheet{right:0;top:0;bottom:0;width:min(430px,62%);overflow:auto}.handle{width:42px;height:4px;border-radius:99px;background:#d0d5dd;margin:9px auto}.sheethead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}.sheethead strong{font-size:13px}.close{width:30px;height:30px;border:0;border-radius:50%;background:#f2f4f7;cursor:pointer}.sheetbody{padding:13px}.field{margin-bottom:10px}.field label{display:block;font-size:8.5px;font-weight:900;color:#475467;margin-bottom:5px}.input{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:9px 10px;font-size:10px;background:#fff}.check{display:flex;gap:7px;align-items:center;font-size:9px;margin:7px 0}.sheetfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:11px 13px;display:flex;gap:7px}.btn{border:0;border-radius:10px;padding:9px 11px;font-size:9px;font-weight:900;cursor:pointer}.btn.primary{background:#4f46e5;color:#fff;flex:1}.btn.secondary{background:#f2f4f7;color:#344054;border:1px solid #e4e7ec}.btn.green{background:#15803d;color:#fff}.btn.red{background:#fff1f0;color:#b42318;border:1px solid #fecdca}.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%) translateY(10px);background:#101828;color:#fff;border-radius:99px;padding:8px 11px;font-size:8px;font-weight:800;z-index:50;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

<body>
<div class="page">
  <div class="intro">
    <div><h1>NILTASK App Workflow Preview</h1><p>Phone + tablet preview for Chat, Tasks, Activity Feed, Reminders and Settings. All interactions are simulated.</p></div>
    <div class="safe">✓ PREVIEW ONLY · NO DATABASE WRITES</div>
  </div>
  <div class="democtrl">
    <div class="seg"><button data-device="phone" class="on">📱 Phone</button><button data-device="tablet">▰ Tablet</button></div>
    <div class="seg"><button data-role="assignee" class="on">Assignee</button><button data-role="creator">Creator</button></div>
    <button class="demo-btn" id="activeDemo">Show Active Task</button>
    <button class="demo-btn" id="normalDemo">Reset to Normal Message</button>
  </div>
  <div class="stage"><div id="device" class="device phone"><div id="screen" class="screen"></div></div></div>
</div>
<script>
(()=>{
const S={device:'phone',role:'assignee',tab:'chat',chat:'list',room:'staff',taskCreated:true,taskStatus:'in_progress',taskMode:false,menu:false,filter:'all',feedFilter:'all',focus:false,extensionPending:false,replies:[],toastTimer:null};
const title='Prepare Class XII Result Analysis & Corrective Plan';
const original='Please prepare the Class XII result analysis, identify weak areas and submit a corrective action plan by 12 August.';
const groups=[['staff','All Staff','AS','18 members · 3 unread',3],['academic','Academic Team','AT','9 members · 1 unread',1],['exam','Examination Cell','EC','6 members',0]];
const dms=[['ramu','Ramu Ji','RJ','Result data compiled',2],['anita','Anita Sharma','AS','Thank you',0],['vikas','Vikas Sir','VS','Please check file',1]];
const tasks=[
 {id:'target',title,who:'Principal → Ramu Ji',status:'in_progress',label:'In Progress',mine:true,byme:false,due:'12 Aug'},
 {id:'t2',title:'Update admission enquiry register',who:'Office Team',status:'pending_ack',label:'Pending',mine:false,byme:true,due:'10 Aug'},
 {id:'t3',title:'Science exhibition duty chart',who:'Academic Team',status:'accepted',label:'Completed',mine:true,byme:false,due:'05 Aug'},
 {id:'t4',title:'Submit monthly attendance summary',who:'Principal → Anita',status:'submitted',label:'Waiting Review',mine:false,byme:true,due:'09 Aug'}
];
let feed=[
 {id:1,type:'message_in',icon:'💬',title:'Message received · Ramu Ji',text:'Result data has been compiled and checked.',time:'2 min ago',unread:true,target:'ramu'},
 {id:2,type:'task',icon:'📋',title:'Task update · Result Analysis',text:'Progress update posted: weak chapters identified.',time:'8 min ago',unread:true,target:'task'},
 {id:3,type:'file',icon:'📎',title:'File uploaded · Result Analysis',text:'Class_XII_Result_Analysis.xlsx',time:'14 min ago',unread:true,target:'task'},
 {id:4,type:'reminder',icon:'🔔',title:'Reminder received',text:'Submit attendance summary by 2:00 PM.',time:'20 min ago',unread:true,target:'reminders'},
 {id:5,type:'message_out',icon:'↗️',title:'Message sent · Academic Team',text:'Please review the circular before lunch.',time:'35 min ago',unread:false,target:'academic'},
 {id:6,type:'bookmark',icon:'🔖',title:'Message bookmarked',text:'Board practical schedule — Examination Cell.',time:'1 hr ago',unread:false,target:'exam'},
 {id:7,type:'task',icon:'✅',title:'Task acknowledged · Ramu Ji',text:'Prepare Class XII Result Analysis.',time:'2 hrs ago',unread:false,target:'task'}
];
function unreadCount(){return feed.filter(x=>x.unread).length}
function statusLabel(){return S.taskStatus==='pending_ack'?'Awaiting Acknowledgement':S.taskStatus==='acknowledged'?'Acknowledged':S.taskStatus==='submitted'?'Waiting for Review':S.taskStatus==='accepted'?'Completed':S.taskStatus==='needs_review'?'Changes Required':'In Progress'}
function statusClass(){return S.taskStatus==='pending_ack'?'p-await':S.taskStatus==='submitted'?'p-review':S.taskStatus==='accepted'?'p-done':S.taskStatus==='needs_review'?'p-return':'p-work'}
function addEvent(action,text,actor){S.replies.push({action,text,actor:actor|| (S.role==='creator'?'Principal':'Ramu Ji'),time:'Now'});feed.unshift({id:Date.now(),type:'task',icon:'📋',title:`Task update · ${action}`,text,time:'Now',unread:S.role==='creator'?false:true,target:'task'});showToast(action+' added as a reply')}
function seedTask(){S.taskCreated=true;S.taskStatus='in_progress';S.taskMode=false;S.extensionPending=false;S.replies=[{action:'Task created',text:'Assigned to Ramu Ji · Due 12 Aug · High priority',actor:'Principal',time:'Yesterday'},{action:'Acknowledged',text:'Acknowledged the task',actor:'Ramu Ji',time:'Yesterday'},{action:'Work started',text:'Started work',actor:'Ramu Ji',time:'Today, 8:05 AM'},{action:'Progress update',text:'Result data compiled; weak chapters identified.',actor:'Ramu Ji',time:'Today, 8:18 AM'}];render()}
function resetNormal(){S.taskCreated=false;S.taskStatus='pending_ack';S.taskMode=false;S.extensionPending=false;S.replies=[];S.tab='chat';S.chat='thread';S.room='staff';render()}
function showToast(text){const t=document.getElementById('toast');if(!t)return;t.textContent=text;t.classList.add('on');clearTimeout(S.toastTimer);S.toastTimer=setTimeout(()=>t.classList.remove('on'),1500)}
function nav(){const n=unreadCount();return `<nav class="bottomnav">
<button data-tab="chat" class="${S.tab==='chat'?'on':''}"><b>💬</b><span>Chat</span></button>
<button data-tab="tasks" class="${S.tab==='tasks'?'on':''}"><b>📋</b><span>Tasks</span></button>
<button data-tab="activity" class="${S.tab==='activity'?'on':''}"><b>🔔</b><span>Activity</span>${n?`<i class="navbadge">${n}</i>`:''}</button>
<button data-tab="reminders" class="${S.tab==='reminders'?'on':''}"><b>⏰</b><span>Reminders</span></button>
<button data-tab="settings" class="${S.tab==='settings'?'on':''}"><b>⚙️</b><span>Settings</span></button>
</nav>`}
function topbar(){return `<div class="topbar"><div class="logo">N</div><div class="topcopy"><strong>NILTASK</strong><span>${S.role==='creator'?'Creator preview · Principal':'Assignee preview · Ramu Ji'}</span></div><button class="topbtn" data-tab="activity">🔔${unreadCount()?`<i class="badge">${unreadCount()}</i>`:''}</button></div>`}
function chatList(inner=false){const rows=(arr,isGroup)=>arr.map(r=>`<div class="listrow" data-open-room="${r[0]}"><div class="ava ${isGroup?'group':''}">${r[2]}</div><div class="rowcopy"><strong>${r[1]}</strong><span>${r[3]}</span></div>${r[4]?`<i class="count unread">${r[4]}</i>`:''}</div>`).join('');return `<div class="${inner?'':'phonebody'}"><div class="sectionlabel">Group Conversations</div>${rows(groups,true)}<div class="sectionlabel">Direct Messages</div>${rows(dms,false)}</div>`}
function taskStrip(){if(!S.taskCreated)return'';return `<div class="taskstrip"><div class="trow"><strong>📋 TASK</strong><span class="pill ${statusClass()}">${statusLabel()}</span></div><div class="trow" style="margin-top:6px"><span>Due 12 Aug · High priority</span><span>1 assignee</span></div></div>`}
function replies(){if(!S.taskCreated||!S.replies.length)return'';return `<div class="thread">${S.replies.map(r=>`<div class="reply"><div class="msgava">${r.actor==='Principal'?'P':'R'}</div><div class="bubble task-reply"><div class="bubblehead"><strong>${r.actor}</strong><span>${r.time}</span></div><div class="msgtext"><span class="eventlabel">${r.action}</span> — ${r.text}</div></div></div>`).join('')}${S.extensionPending&&S.role==='creator'?`<div class="reply"><div class="msgava">R</div><div class="bubble task-reply"><div class="bubblehead"><strong>Ramu Ji</strong><span>Now</span></div><div class="msgtext"><span class="eventlabel">Deadline extension requested</span> — Requested 15 Aug: Need one more day for section-wise comparison.</div><div class="bubbleactions"><button data-action="approve-extension">✓ Approve</button><button data-action="decline-extension">✕ Decline</button></div></div></div>`:''}</div>`}
function msgMenu(){if(!S.menu)return'';return `<div class="menupop">${!S.taskCreated?`<button data-action="create-task">📋 Create Task</button>`:''}<button data-action="bookmark">🔖 Bookmark</button><button>↗ Forward</button><button>✏️ Edit</button></div>`}
function taskTools(){if(!S.taskMode||!S.taskCreated)return'';let tools='';if(S.role==='assignee'){if(S.taskStatus==='pending_ack')tools='<button data-action="ack">✓ Acknowledge</button>';else if(S.taskStatus==='acknowledged')tools='<button data-action="start">▶ Start Work</button>';else if(['in_progress','needs_review'].includes(S.taskStatus))tools='<button data-action="update">💬 Update</button><button data-action="upload">📎 Upload</button><button data-action="delegate">👤 Delegate</button><button data-action="transfer">↔ Transfer</button><button data-action="extension">📅 Extension</button><button data-action="submit">📤 Submit</button>';else tools='<button>⏳ Waiting for creator review</button>'}else{if(S.taskStatus==='submitted')tools='<button data-action="approve">✓ Approve</button><button data-action="return">↩ Return</button><button data-action="transfer">↔ Transfer</button><button data-action="remind">🔔 Reminder</button>';else tools='<button data-action="remind">🔔 Reminder</button><button data-action="deadline">📅 Deadline</button><button data-action="transfer">↔ Transfer</button>'}return `<div class="taskmode"><div class="taskmodehead"><strong>📋 Task controls · replies become the timeline</strong><button data-action="close-taskmode">✕</button></div><div class="tasktools">${tools}</div></div>`}
function chatThread(){return `<div class="chatwrap"><div class="chathead"><button class="back" data-chat-back>←</button><div class="ava group">AS</div><div class="rowcopy"><strong>All Staff</strong><span>18 members · Group Conversation</span></div></div><div class="messages" id="messages"><div class="msg"><div class="msgava">P</div><div id="taskBubble" class="bubble ${S.taskCreated?'task':''} ${S.focus?'focus':''}"><div class="bubblehead"><strong>Principal</strong><span>Yesterday · 4:10 PM <button class="dots" data-action="toggle-menu">⋮</button></span></div><div class="msgtext">${original}</div>${taskStrip()}<div class="bubbleactions"><button data-action="reply-task">↩ Reply</button><button data-action="bookmark">🔖 Bookmark</button>${S.taskCreated?'<button data-action="open-task-dashboard">📋 Task</button>':''}</div>${msgMenu()}</div></div>${replies()}<div class="msg me"><div class="msgava">Y</div><div class="bubble"><div class="bubblehead"><strong>You</strong><span>Today · 8:20 AM</span></div><div class="msgtext">Please keep the section-wise comparison in the final file.</div><div class="bubbleactions"><button>↩ Reply</button><button data-action="bookmark">🔖 Bookmark</button></div></div></div></div><div class="composerbox">${taskTools()}<div class="composer"><input id="composerInput" placeholder="${S.taskMode?'Write task update or comment…':'Type a message…'}"><button data-action="send-message">➤</button></div></div></div>`}
function chatView(){if(S.device==='tablet')return `<div class="tabletgrid"><div class="tabletleft"><div class="panehead"><strong>Chat</strong><span>Groups + DMs</span></div>${chatList(true)}</div><div class="tabletright">${S.chat==='thread'?chatThread():`<div style="display:grid;place-items:center;height:100%;color:#98a2b3;font-size:12px">Select a conversation</div>`}</div></div>`;return S.chat==='thread'?chatThread():chatList(false)}
function taskDashboard(){const visible=tasks.filter(t=>S.filter==='all'||S.filter==='pending'&&t.status!=='accepted'||S.filter==='completed'&&t.status==='accepted'||S.filter==='mine'&&t.mine||S.filter==='byme'&&t.byme);const cards=visible.map(t=>`<div class="taskcard" data-task-card="${t.id}"><h3>${t.title}</h3><div class="meta">${t.who} · Due ${t.due}</div><div class="foot"><span class="pill ${t.status==='accepted'?'p-done':t.status==='submitted'?'p-review':t.status==='pending_ack'?'p-await':'p-work'}">${t.label}</span><span>Open in Chat →</span></div></div>`).join('');return `<div class="dashboard"><div class="dashhero"><strong>Task Dashboard</strong><span>Same filters and task navigation as Web</span><div class="metrics"><div class="metric"><b>4</b><small>All</small></div><div class="metric"><b>3</b><small>Pending</small></div><div class="metric"><b>1</b><small>Completed</small></div><div class="metric"><b>2</b><small>By Me</small></div></div></div><div class="filters"><button data-filter="all" class="${S.filter==='all'?'on':''}">All</button><button data-filter="mine" class="${S.filter==='mine'?'on':''}">Allotted to Me</button><button data-filter="byme" class="${S.filter==='byme'?'on':''}">Allotted by Me</button><button data-filter="pending" class="${S.filter==='pending'?'on':''}">Pending</button><button data-filter="completed" class="${S.filter==='completed'?'on':''}">Completed</button></div>${cards||'<div style="padding:30px;text-align:center;color:#98a2b3;font-size:11px">No matching tasks</div>'}</div>`}
function activity(){const items=feed.filter(x=>S.feedFilter==='all'||x.unread).map(x=>`<div class="feeditem ${x.unread?'unread':''}" data-feed-id="${x.id}"><div class="feedicon">${x.icon}</div><div class="feedcopy"><strong>${x.title}</strong><p>${x.text}</p><small>${x.time}</small></div>${x.unread?'<i class="unreaddot"></i>':''}</div>`).join('');return `<div class="feed"><div class="feedtop"><strong>Activity Feed</strong><div class="feedfilters"><button data-feed-filter="all" class="${S.feedFilter==='all'?'on':''}">All</button><button data-feed-filter="unread" class="${S.feedFilter==='unread'?'on':''}">Unread ${unreadCount()}</button></div></div><div style="font-size:8.5px;color:#667085;margin-bottom:8px">Messages sent/received, task updates, uploads, reminders and bookmarks — all in one stream.</div>${items||'<div style="padding:30px;text-align:center;color:#98a2b3;font-size:11px">No unread activity</div>'}</div>`}
function reminders(){return `<div class="reminders"><div class="sectionlabel">Upcoming Reminders</div><div class="remcard"><div class="remicon">⏰</div><div class="remcopy"><strong>Submit attendance summary</strong><span>Today · 2:00 PM · Personal reminder</span></div><i class="pill p-await">Today</i></div><div class="remcard"><div class="remicon">🔔</div><div class="remcopy"><strong>Follow up on Class XII analysis</strong><span>Tomorrow · 9:00 AM · Task reminder</span></div><i class="pill p-work">Task</i></div><div class="remcard"><div class="remicon">📌</div><div class="remcopy"><strong>Board practical schedule</strong><span>11 Aug · Examination Cell</span></div><i class="pill p-done">Saved</i></div></div>`}
function settings(){return `<div class="settings"><div class="settingsgrid"><div class="settingscard"><strong>👤 Profile</strong><p>Name, designation, photo and personal preferences.</p><div class="settingsline"><span>Name</span><b>${S.role==='creator'?'Principal':'Ramu Ji'}</b></div><div class="settingsline"><span>Notifications</span><b>Enabled</b></div></div><div class="settingscard"><strong>📊 Dashboard</strong><p>Your personal overview and quick statistics.</p><div class="settingsline"><span>Unread Activity</span><b>${unreadCount()}</b></div><div class="settingsline"><span>Pending Tasks</span><b>3</b></div></div><div class="settingscard big"><strong>App Settings</strong><div class="settingsline"><span>Theme</span><b>System</b></div><div class="settingsline"><span>Push Notifications</span><b>On</b></div><div class="settingsline"><span>Installed PWA</span><b>Ready</b></div></div></div></div>`}
function currentView(){if(S.tab==='chat')return chatView();if(S.tab==='tasks')return taskDashboard();if(S.tab==='activity')return activity();if(S.tab==='reminders')return reminders();return settings()}
function render(){const d=document.getElementById('device');d.className='device '+S.device;document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('on',b.dataset.device===S.device));document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('on',b.dataset.role===S.role));document.getElementById('screen').innerHTML=`<div class="statusbar"><span>8:28</span><span>◉ 5G ▰ 91%</span></div><div class="app">${topbar()}<main class="content">${currentView()}</main>${nav()}</div><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>`;if(S.focus){setTimeout(()=>{document.getElementById('taskBubble')?.scrollIntoView({behavior:'smooth',block:'center'});S.focus=false},80)}}
function openSheet(titleText,body,primary,cb){const o=document.getElementById('overlay'),s=document.getElementById('sheet');s.innerHTML=`<div class="handle"></div><div class="sheethead"><strong>${titleText}</strong><button class="close" data-close-sheet>✕</button></div><div class="sheetbody">${body}</div><div class="sheetfoot"><button class="btn secondary" data-close-sheet>Cancel</button><button class="btn primary" id="sheetPrimary">${primary}</button></div>`;o.classList.add('on');document.getElementById('sheetPrimary').onclick=()=>{cb?.();o.classList.remove('on');render()}}
function closeSheet(){document.getElementById('overlay')?.classList.remove('on')}
function createTaskSheet(){openSheet('Create Task from Message',`<div class="field"><label>Task title</label><input class="input" id="ctTitle" value="${title}"></div><div class="field"><label>Assignees</label><label class="check"><input type="checkbox" checked> Ramu Ji</label><label class="check"><input type="checkbox"> Anita Sharma</label></div><div class="field"><label>Deadline</label><input class="input" type="date" value="2026-08-12"></div><div class="field"><label>Priority</label><select class="input"><option>High</option><option>Normal</option><option>Low</option></select></div><label class="check"><input type="checkbox" id="ctProof"> Require proof before submission</label>`,'Create Task',()=>{S.taskCreated=true;S.taskStatus='pending_ack';S.replies=[{action:'Task created',text:'Assigned to Ramu Ji · Due 12 Aug · High priority',actor:S.role==='creator'?'Principal':'Ramu Ji',time:'Now'}];feed.unshift({id:Date.now(),type:'task',icon:'📋',title:'Task created',text:title,time:'Now',unread:false,target:'task'});S.taskMode=true})}
function textSheet(name,label,placeholder,primary,cb){openSheet(name,`<div class="field"><label>${label}</label><textarea class="input" id="sheetText" rows="4" placeholder="${placeholder}"></textarea></div>`,primary,()=>cb((document.getElementById('sheetText')?.value||placeholder).trim()))}
function handleAction(a){S.menu=false;if(a==='toggle-menu'){S.menu=!S.menu;render();return}if(a==='create-task'){createTaskSheet();return}if(a==='bookmark'){feed.unshift({id:Date.now(),type:'bookmark',icon:'🔖',title:'Message bookmarked',text:original,time:'Now',unread:false,target:'staff'});showToast('Bookmarked');render();return}if(a==='reply-task'){S.taskMode=S.taskCreated;render();setTimeout(()=>document.getElementById('composerInput')?.focus(),50);return}if(a==='close-taskmode'){S.taskMode=false;render();return}if(a==='open-task-dashboard'){S.tab='tasks';render();return}if(a==='ack'){S.taskStatus='acknowledged';addEvent('Acknowledged','Acknowledged the task');render();return}if(a==='start'){S.taskStatus='in_progress';addEvent('Work started','Started work');render();return}if(a==='update'){textSheet('Progress Update','What progress has been made?','Section-wise comparison added.','Post Update',t=>addEvent('Progress update',t));return}if(a==='upload'){openSheet('Upload Proof','<div class="field"><label>Select file</label><input class="input" type="file"></div><div style="font-size:9px;color:#667085">Preview simulation: no file is actually uploaded.</div>','Upload',()=>addEvent('File uploaded','Class_XII_Result_Analysis.xlsx'));return}if(a==='delegate'){openSheet('Delegate Task','<div class="field"><label>Delegate to</label><select class="input"><option>Anita Sharma</option><option>Vikas Sir</option></select></div><div class="field"><label>Instructions</label><textarea class="input">Prepare section-wise comparison table.</textarea></div>','Delegate',()=>addEvent('Delegated','Delegated to Anita Sharma · current assignee remains accountable'));return}if(a==='transfer'){openSheet('Transfer Assignment','<div class="field"><label>Transfer to</label><select class="input"><option>Anita Sharma</option><option>Vikas Sir</option></select></div><div class="field"><label>Reason</label><textarea class="input">Reassignment required.</textarea></div>','Transfer',()=>addEvent('Transferred','Ramu Ji → Anita Sharma · Reassignment required.'));return}if(a==='extension'){textSheet('Request Deadline Extension','Reason','Need time for section-wise comparison.','Send Request',t=>{S.extensionPending=true;addEvent('Deadline extension requested','Requested 15 Aug — '+t);});return}if(a==='submit'){S.taskStatus='submitted';addEvent('Submitted for review','Submitted for creator review');render();return}if(a==='approve'){S.taskStatus='accepted';addEvent('Completion accepted','Completion accepted by creator','Principal');render();return}if(a==='return'){textSheet('Return for Changes','Feedback','Add section-wise comparison and resubmit.','Return Task',t=>{S.taskStatus='needs_review';addEvent('Returned for changes',t,'Principal')});return}if(a==='remind'){addEvent('Reminder sent','Reminder sent to pending assignee','Principal');render();return}if(a==='deadline'){textSheet('Change Deadline','Reason','Deadline revised due to review schedule.','Update Deadline',t=>addEvent('Deadline changed','Deadline changed to 14 Aug — '+t,'Principal'));return}if(a==='approve-extension'){S.extensionPending=false;addEvent('Deadline extension approved','Deadline extended to 15 Aug','Principal');render();return}if(a==='decline-extension'){S.extensionPending=false;addEvent('Deadline extension declined','Extension request declined','Principal');render();return}if(a==='send-message'){const input=document.getElementById('composerInput');if(S.taskMode&&input?.value.trim()){addEvent('Progress update',input.value.trim());render()}else showToast('Normal chat message simulated');return}}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-open-room],[data-task-card],[data-feed-id]');if(!b)return;if(b.dataset.device){S.device=b.dataset.device;render();return}if(b.dataset.role){S.role=b.dataset.role;render();return}if(b.dataset.tab){S.tab=b.dataset.tab;if(S.tab==='chat'&&S.device==='phone')S.chat='list';render();return}if(b.dataset.openRoom){S.room=b.dataset.openRoom;S.chat='thread';render();return}if('chatBack'in b.dataset){S.chat='list';render();return}if(b.dataset.filter){S.filter=b.dataset.filter;render();return}if(b.dataset.feedFilter){S.feedFilter=b.dataset.feedFilter;render();return}if(b.dataset.taskCard){S.tab='chat';S.chat='thread';S.room='staff';S.focus=true;S.taskMode=true;render();return}if(b.dataset.feedId){const item=feed.find(x=>String(x.id)===String(b.dataset.feedId));if(item){item.unread=false;if(item.target==='task'){S.tab='chat';S.chat='thread';S.room='staff';S.focus=true;S.taskMode=true}else if(item.target==='reminders'){S.tab='reminders'}else{S.tab='chat';S.chat='thread';S.room=item.target||'staff'}render()}return}if('closeSheet'in b.dataset){closeSheet();return}if(b.dataset.action)handleAction(b.dataset.action)});
document.getElementById('activeDemo').onclick=seedTask;document.getElementById('normalDemo').onclick=resetNormal;render();
})();
</script>
</body>
</html>
