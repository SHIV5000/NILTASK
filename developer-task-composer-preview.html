<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>NILTASK One Composer Preview</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--ink:#101828;--muted:#667085;--line:#e4e7ec;--bg:#f4f6fb;--card:#fff;--accent:#4f46e5;--green:#15803d;--red:#b42318;--amber:#b54708;--shadow:0 18px 55px rgba(16,24,40,.16)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9edff,#f8fafc 42%,#eef2f7);color:var(--ink);min-height:100vh}.page{max-width:1180px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}.head h1{font-size:23px;margin:0}.head p{font-size:12px;color:var(--muted);margin:5px 0 0}.safe{background:#ecfdf3;border:1px solid #abefc6;color:#067647;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}.switches{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.seg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;display:flex}.seg button{border:0;background:transparent;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:900;color:#667085;cursor:pointer}.seg button.on{background:#eef2ff;color:#3730a3}.stage{display:flex;justify-content:center}.device{background:#101828;border:8px solid #101828;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.device.phone{width:390px;height:780px;border-radius:31px}.device.tablet{width:min(1000px,96vw);height:670px;border-radius:23px}.screen{height:100%;background:var(--bg);position:relative;overflow:hidden;display:flex}.phone .screen{flex-direction:column}.tablet .screen{flex-direction:row}.status{height:26px;background:#312e81;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:9px;font-weight:900;flex:none}.tablet .status{display:none}.rail{width:72px;background:#1f2454;color:#c7d2fe;display:flex;flex-direction:column;align-items:center;padding:13px 7px;gap:11px}.rail .rlogo{width:42px;height:42px;border-radius:13px;background:#4f46e5;color:#fff;display:grid;place-items:center;font-size:19px}.rail button{width:55px;border:0;background:transparent;color:#c7d2fe;border-radius:12px;padding:8px 2px;font-size:8px;font-weight:900}.rail button b{display:block;font-size:17px;margin-bottom:3px}.rail button.on{background:rgba(255,255,255,.14);color:#fff}.side{width:300px;background:#f8fafc;border-right:1px solid var(--line);padding:14px;overflow:auto}.phone .rail,.phone .side{display:none}.app{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}.top{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:8px 11px;flex:none}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:900}.toptext{flex:1;min-width:0}.toptext b{display:block;font-size:13px}.toptext span{font-size:9px;color:var(--muted)}.bell{position:relative;width:34px;height:34px;border:0;border-radius:50%;background:#f2f4f7;font-size:16px}.badge{position:absolute;right:-2px;top:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#dc2626;color:#fff;font-size:8px;font-weight:900;display:grid;place-items:center}.main{flex:1;min-height:0;overflow:auto;padding:10px 10px 126px}.bottom{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.bottom button{border:0;background:none;color:#667085;font-size:8px;font-weight:900;display:grid;place-items:center;gap:1px}.bottom button b{font-size:17px}.bottom button.on{color:#4338ca}.tablet .bottom{display:none}.tablet .main{padding-bottom:98px}.section{font-size:9px;color:#667085;text-transform:uppercase;letter-spacing:.08em;font-weight:900;margin:10px 2px 6px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(16,24,40,.04)}.contact{display:flex;align-items:center;gap:9px}.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#4338ca;font-size:10px;font-weight:900}.contact .copy{flex:1}.contact .copy b{display:block;font-size:11px}.contact .copy span{font-size:9px;color:#667085}.chathead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.back{border:0;width:32px;height:32px;border-radius:50%;background:#eef2ff;color:#4338ca}.chat-title{flex:1}.chat-title b{font-size:12px}.chat-title span{display:block;font-size:8px;color:#15803d;font-weight:800}.msg{display:flex;gap:7px;align-items:flex-start;margin-bottom:7px}.msg .ava{width:27px;height:27px;background:#fee4e2;color:#b42318;flex:none}.bubble{flex:1;background:#fff;border:1px solid var(--line);border-radius:6px 15px 15px 15px;padding:9px 10px;position:relative}.bubble.task{border-left:4px solid #4f46e5;background:#fcfcff}.bubblehead{display:flex;justify-content:space-between;gap:7px}.bubblehead b{font-size:9px}.bubblehead span{font-size:8px;color:#98a2b3}.bubble p{font-size:10px;line-height:1.45;margin:5px 0}.taskstrip{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 2px}.pill{font-size:8px;font-weight:900;border-radius:999px;padding:5px 7px}.pwork{background:#eef2ff;color:#4338ca}.pdue{background:#fff7ed;color:#b54708}.ptask{background:#ecfdf3;color:#067647}.msgactions{display:flex;gap:11px;margin-top:7px;color:#667085;font-size:8px;font-weight:900}.msgactions button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}.thread{margin-left:34px;border-left:2px solid #dbe3f0;padding-left:8px}.reply{display:flex;gap:6px;margin-bottom:7px}.reply .ava{width:22px;height:22px}.reply .bubble{padding:7px 8px;background:#fbfcff}.reply .bubble p{font-size:9px;margin:3px 0}.eventlabel{color:#4338ca;font-weight:900}.focus{outline:3px solid #c7d2fe;outline-offset:2px}.taskfilters{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.taskfilters button{white-space:nowrap;border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:7px 9px;font-size:8px;font-weight:900;color:#475467}.taskfilters button.on{background:#4f46e5;color:#fff;border-color:#4f46e5}.activity{display:flex;gap:9px;align-items:flex-start}.activity.unread{background:#eef2ff}.activity .copy{flex:1}.activity .copy b{font-size:10px}.activity .copy p{font-size:9px;color:#667085;margin:3px 0}.smallbadge{background:#dc2626;color:#fff;border-radius:999px;padding:3px 6px;font-size:7px;font-weight:900}
/* ONE composer only. It changes mode in place. */
.composer-shell{position:absolute;left:0;right:0;bottom:64px;background:#fff;border-top:1px solid var(--line);padding:8px;z-index:4}.tablet .composer-shell{bottom:0}.composer-context{display:none;border-bottom:1px solid #e4e7ec;padding:0 2px 7px;margin-bottom:7px}.composer-shell.task-mode .composer-context{display:block}.context-top{display:flex;gap:7px;align-items:center}.context-top b{font-size:9px;color:#3730a3;flex:1}.context-top button{border:0;background:none;color:#667085;font-size:15px}.chips{display:flex;gap:5px;overflow:auto;margin-top:6px}.chip{white-space:nowrap;border:1px solid #c7d2fe;background:#fff;color:#3730a3;border-radius:999px;padding:6px 8px;font-size:8px;font-weight:900}.chip.on{background:#4f46e5;color:#fff;border-color:#4f46e5}.dynamic{display:none;margin-top:7px}.composer-shell.task-mode .dynamic{display:block}.dynamic-row{display:flex;gap:5px}.dynamic input,.dynamic select,.dynamic textarea{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:8px;font:inherit;font-size:9px;background:#fff}.dynamic textarea{min-height:48px;resize:none}.dynamic-row>*{flex:1}.main-composer{display:flex;align-items:flex-end;gap:6px}.main-composer textarea{flex:1;border:1px solid #d0d5dd;border-radius:12px;padding:9px 10px;font:inherit;font-size:10px;min-height:38px;max-height:76px;resize:none}.main-composer button{width:36px;height:36px;border:0;border-radius:11px;background:#4f46e5;color:#fff}.main-composer .attach{background:#f2f4f7;color:#475467}.composer-shell.task-mode .main-composer .attach{display:none}.composer-shell.task-mode .main-composer textarea{border-color:#a5b4fc;background:#fafaff}.sendlabel{display:none}.composer-shell.task-mode .sendlabel{display:inline;font-size:8px;font-weight:900;margin-right:5px}.composer-shell.task-mode .sendicon{display:none}.hint{font-size:8px;color:#667085;margin-top:5px;display:none}.composer-shell.task-mode .hint{display:block}.side h3{font-size:10px;color:#667085;text-transform:uppercase;letter-spacing:.08em}.side .card{cursor:pointer}.side .card.active{outline:2px solid #c7d2fe}
@media(max-width:600px){.page{padding:10px}.head h1{font-size:19px}.device.phone{height:750px}}
</style>
</head>
<body>
<div class="page">
  <div class="head"><div><h1>One Chat Composer Preview</h1><p>Task actions transform the existing chat composer. There is never a second composer.</p></div><div class="safe">✓ PREVIEW ONLY · NO DATABASE WRITES</div></div>
  <div class="switches"><div class="seg"><button id="phoneBtn" class="on">📱 Phone</button><button id="tabletBtn">▰ Tablet</button></div></div>
  <div class="stage"><div id="device" class="device phone"><div id="screen" class="screen"></div></div></div>
</div>
<script>
const S={device:'phone',tab:'chat',room:true,taskMode:false,action:'update',replies:[['ACKNOWLEDGE','Acknowledged the task'],['START','Started work'],['UPDATE','Result data compiled; weak chapters identified.']]};
const title='Prepare Class XII Result Analysis & Corrective Plan';
function nav(){return `<div class="bottom">${[['chat','💬','Chat'],['tasks','✅','Tasks'],['activity','🔔','Activity'],['reminders','⏰','Reminders'],['settings','⚙️','Settings']].map(x=>`<button data-tab="${x[0]}" class="${S.tab===x[0]?'on':''}"><b>${x[1]}</b>${x[2]}${x[0]==='activity'?'<span class="smallbadge">4</span>':''}</button>`).join('')}</div>`}
function rail(){return `<div class="rail"><div class="rlogo">N</div>${[['chat','💬','Chat'],['tasks','✅','Tasks'],['activity','🔔','Activity'],['reminders','⏰','Reminders'],['settings','⚙️','Settings']].map(x=>`<button data-tab="${x[0]}" class="${S.tab===x[0]?'on':''}"><b>${x[1]}</b>${x[2]}</button>`).join('')}</div>`}
function side(){if(S.device!=='tablet')return'';return `<div class="side"><h3>Groups</h3><div class="card active"><div class="contact"><div class="ava">L</div><div class="copy"><b>Leadership</b><span>Principal · VP · HOD</span></div></div></div><div class="card"><div class="contact"><div class="ava">S</div><div class="copy"><b>Staff Room</b><span>28 members</span></div></div></div><h3>Direct Messages</h3><div class="card"><div class="contact"><div class="ava">R</div><div class="copy"><b>Ramu Ji</b><span>Online</span></div></div></div><div class="card"><div class="contact"><div class="ava">A</div><div class="copy"><b>Anita Ma’am</b><span>Last message 8:04 AM</span></div></div></div></div>`}
function top(){return `<div class="top"><div class="logo">N</div><div class="toptext"><b>NILTASK</b><span>Leadership</span></div><button class="bell">🔔<span class="badge">4</span></button></div>`}
function chat(){return `<div class="chathead"><button class="back">‹</button><div class="ava">L</div><div class="chat-title"><b>Leadership</b><span>● Online</span></div></div><div class="msg"><div class="ava">P</div><div id="taskBubble" class="bubble task"><div class="bubblehead"><b>Principal</b><span>8:15 AM · ⋮</span></div><p>Please prepare the Class XII result analysis, identify weak areas and submit a corrective action plan by 12 August.</p><div class="taskstrip"><span class="pill ptask">TASK</span><span class="pill pwork">In Progress</span><span class="pill pdue">Due 12 Aug</span></div><div class="msgactions"><button id="replyTask">↩ Reply</button><button>🔖 Bookmark</button></div></div></div><div class="thread">${S.replies.map(r=>`<div class="reply"><div class="ava">R</div><div class="bubble"><div class="bubblehead"><b>Ramu Ji</b><span>Now</span></div><p><span class="eventlabel">${r[0]}</span> — ${r[1]}</p></div></div>`).join('')}</div>`}
function tasks(){return `<div class="section">Task Dashboard</div><div class="taskfilters"><button class="on">All</button><button>Allotted to Me</button><button>Allotted by Me</button><button>Pending</button><button>Completed</button></div><div id="taskJump" class="card"><b style="font-size:11px">${title}</b><p style="font-size:9px;color:#667085">Leadership · In Progress · Due 12 Aug</p><div class="taskstrip"><span class="pill pwork">In Progress</span><span class="pill ptask">Open in Chat</span></div></div>`}
function activity(){return `<div class="section">Activity Feed</div>${[['💬','Message received','Principal sent a new message'],['✅','Task update','Ramu Ji posted progress'],['📎','File upload','result-analysis.pdf uploaded'],['⏰','Reminder','Task reminder sent'],['🔖','Bookmark','Message bookmarked']].map((x,i)=>`<div class="card activity ${i<2?'unread':''}"><div class="ava">${x[0]}</div><div class="copy"><b>${x[1]}</b><p>${x[2]}</p></div>${i<2?'<span class="smallbadge">NEW</span>':''}</div>`).join('')}`}
function simple(name,body){return `<div class="section">${name}</div><div class="card" style="font-size:10px;line-height:1.6">${body}</div>`}
function composer(){if(S.tab!=='chat'||!S.room)return'';const cfg={update:['Write progress update…','textarea'],upload:['Choose proof file…','file'],delegate:['Delegate to staff member…','select'],transfer:['Transfer to replacement…','select'],extension:['Reason for extension…','extension'],submit:['Optional submission note…','textarea']}[S.action];let dynamic='';if(S.taskMode){if(cfg[1]==='file')dynamic=`<div class="dynamic"><input id="taskFile" type="file"></div>`;else if(cfg[1]==='select')dynamic=`<div class="dynamic"><select id="taskSelect"><option>${S.action==='delegate'?'Select staff member':'Select replacement'}</option><option>Anita Ma’am</option><option>Office Admin</option></select></div>`;else if(cfg[1]==='extension')dynamic=`<div class="dynamic"><div class="dynamic-row"><input id="taskDate" type="date"><input id="taskReason" placeholder="Reason"></div></div>`;else dynamic='';}
return `<div id="composerShell" class="composer-shell ${S.taskMode?'task-mode':''}"><div class="composer-context"><div class="context-top"><b>↩ Task reply · ${title}</b><button id="cancelTaskMode">×</button></div><div class="chips">${['update','upload','delegate','transfer','extension','submit'].map(a=>`<button class="chip ${S.action===a?'on':''}" data-action="${a}">${a[0].toUpperCase()+a.slice(1)}</button>`).join('')}</div>${dynamic}</div><div class="main-composer"><button class="attach">＋</button><textarea id="chatInput" placeholder="${S.taskMode?(cfg?cfg[0]:'Write task reply…'):'Message Leadership…'}"></textarea><button id="sendBtn"><span class="sendlabel">${S.taskMode?'Post':'Send'}</span><span class="sendicon">➤</span></button></div><div class="hint">Same chat composer is now in Task Mode. No second input box exists.</div></div>`}
function renderMain(){let body=S.tab==='chat'?(S.room?chat():simple('Chat','Groups first, then Direct Messages.')):S.tab==='tasks'?tasks():S.tab==='activity'?activity():S.tab==='reminders'?simple('Reminders','Upcoming reminders and completed reminder history appear here.'):simple('Settings','Profile<br>Dashboard');return `<div class="app">${S.device==='phone'?'<div class="status"><span>8:48</span><span>5G ▰</span></div>':''}${top()}<div class="main">${body}</div>${composer()}${S.device==='phone'?nav():''}</div>`}
function render(){document.getElementById('device').className='device '+S.device;document.getElementById('screen').innerHTML=(S.device==='tablet'?rail()+side():'')+renderMain();wire()}
function wire(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;if(S.tab==='chat')S.room=true;S.taskMode=false;render()});document.getElementById('replyTask')?.addEventListener('click',()=>{S.taskMode=true;S.action='update';render();setTimeout(()=>document.getElementById('chatInput')?.focus(),20)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{S.action=b.dataset.action;render();setTimeout(()=>document.getElementById('chatInput')?.focus(),20)});document.getElementById('cancelTaskMode')?.addEventListener('click',()=>{S.taskMode=false;render()});document.getElementById('sendBtn')?.addEventListener('click',()=>{const input=document.getElementById('chatInput');if(!S.taskMode){if(input?.value.trim())alert('Normal chat message would send from this same composer.');return;}let text=input?.value.trim()||'';let label=S.action.toUpperCase();if(S.action==='upload')text=document.getElementById('taskFile')?.files?.[0]?.name||'result-analysis.pdf';if(S.action==='delegate')text='Delegated to '+(document.getElementById('taskSelect')?.value||'staff member');if(S.action==='transfer')text='Transferred to '+(document.getElementById('taskSelect')?.value||'replacement');if(S.action==='extension')text='Requested extension to '+(document.getElementById('taskDate')?.value||'new date')+' — '+(document.getElementById('taskReason')?.value||'Reason');if(S.action==='submit'&&!text)text='Submitted for review';if(S.action==='update'&&!text)text='Progress update posted';S.replies.push([label,text]);S.taskMode=false;render();setTimeout(()=>document.getElementById('taskBubble')?.scrollIntoView({behavior:'smooth',block:'center'}),30)});document.getElementById('taskJump')?.addEventListener('click',()=>{S.tab='chat';S.room=true;S.taskMode=false;render();setTimeout(()=>{const el=document.getElementById('taskBubble');el?.classList.add('focus');el?.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>el?.classList.remove('focus'),1500)},30)});}
document.getElementById('phoneBtn').onclick=()=>{S.device='phone';document.getElementById('phoneBtn').classList.add('on');document.getElementById('tabletBtn').classList.remove('on');render()};document.getElementById('tabletBtn').onclick=()=>{S.device='tablet';document.getElementById('tabletBtn').classList.add('on');document.getElementById('phoneBtn').classList.remove('on');render()};render();
</script>
</body>
</html>
