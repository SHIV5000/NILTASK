<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--ink:#101828;--muted:#667085;--line:#e4e7ec;--bg:#f4f6fb;--card:#fff;--accent:#4f46e5;--green:#15803d;--red:#b42318;--amber:#b54708;--shadow:0 18px 55px rgba(16,24,40,.16)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9edff,#f8fafc 42%,#eef2f7);color:var(--ink);min-height:100vh}.page{max-width:1180px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}.head h1{font-size:23px;margin:0}.head p{font-size:12px;color:var(--muted);margin:5px 0 0}.safe{background:#ecfdf3;border:1px solid #abefc6;color:#067647;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}.switches{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.seg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;display:flex}.seg button{border:0;background:transparent;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:900;color:#667085;cursor:pointer}.seg button.on{background:#eef2ff;color:#3730a3}.stage{display:flex;justify-content:center}.device{background:#101828;border:8px solid #101828;overflow:hidden;box-shadow:var(--shadow);transition:.2s}.device.phone{width:390px;height:780px;border-radius:31px}.device.tablet{width:min(1000px,96vw);height:670px;border-radius:23px}.screen{height:100%;background:var(--bg);position:relative;overflow:hidden;display:flex}.phone .screen{flex-direction:column}.tablet .screen{flex-direction:row}.status{height:26px;background:#312e81;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:9px;font-weight:900;flex:none}.tablet .status{display:none}.app{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}.top{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:8px 11px;flex:none}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:900}.toptext{flex:1;min-width:0}.toptext b{display:block;font-size:13px}.toptext span{font-size:9px;color:var(--muted)}.bell{position:relative;width:34px;height:34px;border:0;border-radius:50%;background:#f2f4f7;font-size:16px}.badge{position:absolute;right:-2px;top:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#dc2626;color:#fff;font-size:8px;font-weight:900;display:grid;place-items:center}.main{flex:1;min-height:0;overflow:auto;padding:10px 10px 154px}.bottom{position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.bottom button{border:0;background:none;color:#667085;font-size:8px;font-weight:900;display:grid;place-items:center;gap:1px}.bottom button b{font-size:17px}.bottom button.on{color:#4338ca}.rail{width:72px;background:#1f2454;color:#c7d2fe;display:flex;flex-direction:column;align-items:center;padding:13px 7px;gap:11px}.rail .rlogo{width:42px;height:42px;border-radius:13px;background:#4f46e5;color:#fff;display:grid;place-items:center;font-size:19px}.rail button{width:55px;border:0;background:transparent;color:#c7d2fe;border-radius:12px;padding:8px 2px;font-size:8px;font-weight:900}.rail button b{display:block;font-size:17px;margin-bottom:3px}.rail button.on{background:rgba(255,255,255,.14);color:#fff}.tablet .bottom{display:none}.tablet .main{padding-bottom:96px}.tablet .app{position:relative}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(16,24,40,.04)}.section{font-size:9px;color:#667085;text-transform:uppercase;letter-spacing:.08em;font-weight:900;margin:10px 2px 6px}.contact{display:flex;align-items:center;gap:9px;cursor:pointer}.ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#4338ca;font-size:10px;font-weight:900}.contact .copy{flex:1;min-width:0}.contact .copy b{display:block;font-size:11px}.contact .copy span{font-size:9px;color:#667085}.unread-dot{width:8px;height:8px;border-radius:50%;background:#4f46e5}.chathead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.back{border:0;width:32px;height:32px;border-radius:50%;background:#eef2ff;color:#4338ca}.chat-title{flex:1}.chat-title b{font-size:12px}.chat-title span{display:block;font-size:8px;color:#15803d;font-weight:800}.msg{display:flex;gap:7px;align-items:flex-start;margin-bottom:7px}.msg .ava{width:27px;height:27px;background:#fee4e2;color:#b42318;flex:none}.bubble{flex:1;background:#fff;border:1px solid var(--line);border-radius:6px 15px 15px 15px;padding:9px 10px;position:relative}.bubble.task{border-left:4px solid #4f46e5;background:#fcfcff}.bubblehead{display:flex;justify-content:space-between;gap:7px}.bubblehead b{font-size:9px}.bubblehead span{font-size:8px;color:#98a2b3}.bubble p{font-size:10px;line-height:1.45;margin:5px 0}.taskstrip{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 2px}.pill{font-size:8px;font-weight:900;border-radius:999px;padding:5px 7px}.pwork{background:#eef2ff;color:#4338ca}.pdue{background:#fff7ed;color:#b54708}.ptask{background:#ecfdf3;color:#067647}.msgactions{display:flex;gap:11px;margin-top:7px;color:#667085;font-size:8px;font-weight:900}.msgactions button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}.menu{position:absolute;right:6px;top:25px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 25px rgba(16,24,40,.15);padding:5px;z-index:10;display:none}.menu.on{display:block}.menu button{display:block;border:0;background:#fff;width:120px;text-align:left;padding:8px;border-radius:8px;font-size:9px;font-weight:800}.menu button:hover{background:#f2f4f7}.thread{margin-left:34px;border-left:2px solid #dbe3f0;padding-left:8px}.reply{display:flex;gap:6px;margin-bottom:7px}.reply .ava{width:22px;height:22px}.reply .bubble{padding:7px 8px;background:#fbfcff}.reply .bubble p{font-size:9px;margin:3px 0}.eventlabel{color:#4338ca;font-weight:900}.focus{outline:3px solid #c7d2fe;outline-offset:2px}
.composer-wrap{position:absolute;left:0;right:0;bottom:64px;background:#fff;border-top:1px solid var(--line);padding:7px 8px 8px;z-index:4}.tablet .composer-wrap{bottom:0}.taskmode{display:none;background:#eef2ff;border:1px solid #c7d2fe;border-radius:11px;padding:7px 8px;margin-bottom:6px}.taskmode.on{display:block}.taskmode-top{display:flex;align-items:center;gap:7px}.taskmode-top b{font-size:9px;color:#3730a3;flex:1}.taskmode-top button{border:0;background:none;color:#667085}.chips{display:flex;gap:5px;overflow:auto;margin-top:6px;padding-bottom:1px}.chip{white-space:nowrap;border:1px solid #c7d2fe;background:#fff;color:#3730a3;border-radius:999px;padding:6px 8px;font-size:8px;font-weight:900}.chip.on{background:#4f46e5;color:#fff;border-color:#4f46e5}.inline-panel{display:none;margin-top:7px}.inline-panel.on{display:block}.inline-panel input,.inline-panel textarea,.inline-panel select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:8px;font:inherit;font-size:9px;background:#fff;margin-bottom:5px}.inline-panel textarea{min-height:55px;resize:none}.inline-row{display:flex;gap:5px}.inline-row>*{flex:1}.send-action{width:100%;border:0;background:#4f46e5;color:#fff;border-radius:9px;padding:8px;font-size:9px;font-weight:900}.composer{display:flex;align-items:flex-end;gap:6px}.composer textarea{flex:1;border:1px solid #d0d5dd;border-radius:12px;padding:9px 10px;font:inherit;font-size:10px;min-height:38px;max-height:74px;resize:none}.composer button{width:36px;height:36px;border:0;border-radius:11px;background:#4f46e5;color:#fff}.composer .attach{background:#f2f4f7;color:#475467}
.filters{display:flex;gap:5px;overflow:auto;margin-bottom:9px}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;font-size:8px;font-weight:900;color:#667085}.filter.on{background:#4f46e5;color:#fff;border-color:#4f46e5}.taskcard{cursor:pointer;border-left:4px solid #818cf8}.taskcard h3{font-size:12px;margin:4px 0}.meta{font-size:8px;color:#667085;line-height:1.45}.row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.taskcard .go{margin-top:8px;width:100%;border:0;background:#eef2ff;color:#4338ca;border-radius:9px;padding:8px;font-size:8px;font-weight:900}.activity{display:flex;gap:9px;align-items:flex-start}.activity.unread{background:#eef4ff;border-color:#c7d7fe}.acticon{width:32px;height:32px;border-radius:10px;background:#eef2ff;color:#4338ca;display:grid;place-items:center}.actcopy{flex:1}.actcopy b{display:block;font-size:10px}.actcopy p{font-size:9px;color:#667085;margin:3px 0}.actcopy span{font-size:8px;color:#98a2b3}.settings-grid{display:grid;grid-template-columns:1fr;gap:8px}.settings-grid .card{margin:0}.setting-title{font-size:11px;font-weight:900}.dashgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.dash{background:#f8fafc;border:1px solid #eef2f6;border-radius:10px;padding:8px;text-align:center}.dash b{font-size:15px;display:block}.dash span{font-size:7px;color:#667085;text-transform:uppercase;font-weight:900}.empty{text-align:center;color:#667085;font-size:10px;padding:25px 10px}
.tablet-list{width:280px;border-right:1px solid var(--line);background:#f8fafc;overflow:auto;padding:10px}.tablet-chat{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}.tablet-chat .main{padding-bottom:96px}
@media(max-width:600px){.page{padding:9px}.head h1{font-size:18px}.device.phone{height:760px}}
</style>
</head>
<body>
<div class="page">
 <div class="head"><div><h1>Chat-Composer Task Workflow</h1><p>Phone + tablet preview. Task actions stay inside the normal chat input area — no task-action dialogs.</p></div><div class="safe">✓ PREVIEW ONLY · NO DATABASE WRITES</div></div>
 <div class="switches"><div class="seg" id="devSeg"><button class="on" data-dev="phone">📱 Phone</button><button data-dev="tablet">▰ Tablet</button></div><div class="seg" id="roleSeg"><button class="on" data-role="assignee">Assignee</button><button data-role="creator">Creator</button></div></div>
 <div class="stage"><div class="device phone" id="device"><div class="screen" id="screen"></div></div></div>
</div>
<script>
(()=>{
const S={dev:'phone',role:'assignee',tab:'chat',chatOpen:true,task:true,taskMode:false,action:'update',filter:'all',unread:4,menu:false,replies:[
 {who:'Ramu Ji',type:'ACKNOWLEDGE',text:'Acknowledged the task'},
 {who:'Ramu Ji',type:'START',text:'Started work'},
 {who:'Ramu Ji',type:'UPDATE',text:'Result data compiled; weak chapters identified.'}
]};
const title='Prepare Class XII Result Analysis & Corrective Plan';
const original='Please prepare the Class XII result analysis, identify weak areas and submit a corrective action plan by 12 August.';
const labels={UPDATE:'Progress update',FILE:'File uploaded',DELEGATE:'Delegated',TRANSFER:'Transferred',EXTENSION_REQUEST:'Deadline extension requested',SUBMIT:'Submitted for review',ACCEPT:'Completion accepted',RETURN:'Returned for changes'};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function nav(){const items=[['chat','💬','Chat'],['tasks','✅','Tasks'],['activity','🔔','Activity'],['reminders','⏰','Reminders'],['settings','⚙️','Settings']];return items.map(([id,ic,l])=>`<button data-tab="${id}" class="${S.tab===id?'on':''}"><b>${ic}</b>${l}${id==='activity'&&S.unread?`<span class="badge">${S.unread}</span>`:''}</button>`).join('')}
function contacts(){return `<div class="section">Groups</div>${[['Leadership','Principal · VP · HOD'],['Staff Room','28 members']].map((x,i)=>`<div class="card contact" data-openchat><div class="ava">${i?'S':'L'}</div><div class="copy"><b>${x[0]}</b><span>${x[1]}</span></div>${i?'':'<span class="unread-dot"></span>'}</div>`).join('')}<div class="section">Direct Messages</div>${[['Ramu Ji','Online'],['Anita Ma’am','Last message 8:04 AM'],['Office','2 unread']].map((x,i)=>`<div class="card contact" data-openchat><div class="ava">${x[0][0]}</div><div class="copy"><b>${x[0]}</b><span>${x[1]}</span></div>${i===2?'<span class="pill pwork">2</span>':''}</div>`).join('')}`}
function taskBubble(){return `<div class="msg" id="taskBubble"><div class="ava">P</div><div class="bubble ${S.task?'task':''}"><div class="bubblehead"><b>Principal</b><span>8:15 AM · <button data-menu style="border:0;background:none;font-weight:900">⋮</button></span></div><p>${esc(original)}</p>${S.task?`<div class="taskstrip"><span class="pill ptask">TASK</span><span class="pill pwork">In Progress</span><span class="pill pdue">Due 12 Aug</span></div>`:''}<div class="msgactions"><button data-reply>↩ Reply</button><button>🔖 Bookmark</button></div><div class="menu ${S.menu?'on':''}"><button data-create>${S.task?'Open Task Controls':'Create Task'}</button><button>Bookmark</button><button>Forward</button></div></div></div>${S.task?`<div class="thread">${S.replies.map(r=>`<div class="reply"><div class="ava">${esc(r.who[0])}</div><div class="bubble"><div class="bubblehead"><b>${esc(r.who)}</b><span>Now</span></div><p><span class="eventlabel">${esc(labels[r.type]||r.type)}</span>${r.text?` — ${esc(r.text)}`:''}</p></div></div>`).join('')}</div>`:''}`}
function actionPanel(){if(!S.taskMode)return '';const common=`<div class="chips">${[['update','Update'],['upload','Upload'],['delegate','Delegate'],['transfer','Transfer'],['extension','Extension'],['submit','Submit']].map(([id,l])=>`<button class="chip ${S.action===id?'on':''}" data-action="${id}">${l}</button>`).join('')}</div>`;let body='';if(S.action==='update')body=`<textarea id="taskText" placeholder="Write progress update in the chat composer..."></textarea><button class="send-action" data-send>Post Update as Reply</button>`;if(S.action==='upload')body=`<input id="taskFile" type="file"><textarea id="taskText" placeholder="Optional note about this upload"></textarea><button class="send-action" data-send>Upload & Post Reply</button>`;if(S.action==='delegate')body=`<select id="taskPerson"><option>Choose staff member</option><option>Anita Ma’am</option><option>Office Team</option></select><textarea id="taskText" placeholder="Delegation instructions"></textarea><button class="send-action" data-send>Delegate & Post Reply</button>`;if(S.action==='transfer')body=`<select id="taskPerson"><option>Choose replacement</option><option>Anita Ma’am</option><option>Office Team</option></select><textarea id="taskText" placeholder="Reason for transfer"></textarea><button class="send-action" data-send>Transfer & Post Reply</button>`;if(S.action==='extension')body=`<div class="inline-row"><input id="taskDate" type="date"><input id="taskText" placeholder="Reason"></div><button class="send-action" data-send>Request Extension & Post Reply</button>`;if(S.action==='submit')body=`<div class="card" style="margin:0 0 6px;padding:8px;font-size:9px">Submit current work for creator review. The event will appear as a reply below the original task message.</div><button class="send-action" data-send>Submit for Review</button>`;return `<div class="taskmode on"><div class="taskmode-top"><b>📋 Task Mode · ${esc(title)}</b><button data-closemode>✕</button></div>${common}<div class="inline-panel on">${body}</div></div>`}
function composer(){return `<div class="composer-wrap">${actionPanel()}<div class="composer"><button class="attach">＋</button><textarea placeholder="${S.taskMode?'Task action input is active above':'Message'}"></textarea><button>➤</button></div></div>`}
function chat(){return `<div class="chathead"><button class="back" data-back>‹</button><div class="ava">L</div><div class="chat-title"><b>Leadership</b><span>● Online</span></div></div>${taskBubble()}<div class="msg"><div class="ava">R</div><div class="bubble"><div class="bubblehead"><b>Ramu Ji</b><span>8:18 AM</span></div><p>I have started compiling the result analysis.</p><div class="msgactions"><button>↩ Reply</button><button>🔖 Bookmark</button></div></div></div>`}
function tasks(){const filters=[['all','All'],['to','Allotted to Me'],['by','Allotted by Me'],['pending','Pending'],['done','Completed']];return `<div class="filters">${filters.map(([id,l])=>`<button class="filter ${S.filter===id?'on':''}" data-filter="${id}">${l}</button>`).join('')}</div><div class="card taskcard" data-jump><div class="row"><span class="pill pwork">In Progress</span><span class="pill pdue">12 Aug</span></div><h3>${esc(title)}</h3><div class="meta">Created by Principal · 1 assignee · latest update in chat replies</div><button class="go">Open original chat & manage task there →</button></div><div class="card taskcard"><div class="row"><span class="pill ptask">Completed</span></div><h3>Upload examination circular</h3><div class="meta">Created by you · completed yesterday</div><button class="go">Open original chat →</button></div>`}
function activity(){const rows=[['💬','Message received','Leadership · “Please prepare the Class XII result analysis…”',true],['📋','Task progress update','Ramu Ji · Result data compiled; weak chapters identified.',true],['📎','File uploaded','Result_Analysis.xlsx',true],['⏰','Reminder','Result meeting tomorrow at 9:00 AM',true],['🔖','Bookmark added','Board circular bookmarked',false],['💬','Message sent','You replied in Leadership',false]];return rows.map((r,i)=>`<div class="card activity ${r[3]?'unread':''}" data-read="${i}"><div class="acticon">${r[0]}</div><div class="actcopy"><b>${r[1]} ${r[3]?'<span class="pill pwork">UNREAD</span>':''}</b><p>${r[2]}</p><span>Today · ${8+i}:2${i} AM</span></div></div>`).join('')}
function reminders(){return `<div class="card"><div class="row"><span class="pill pdue">TODAY</span></div><div class="title" style="font-size:12px;font-weight:900;margin-top:6px">Result analysis deadline reminder</div><div class="meta">12 Aug 2026 · linked to task in Leadership</div></div><div class="card"><div class="title" style="font-size:12px;font-weight:900">Staff meeting</div><div class="meta">Tomorrow · 9:00 AM</div></div>`}
function settings(){return `<div class="settings-grid"><div class="card"><div class="setting-title">👤 Profile</div><div class="meta">Name, designation, photo, notification preferences</div></div><div class="card"><div class="setting-title">📊 Dashboard</div><div class="dashgrid"><div class="dash"><b>7</b><span>Open Tasks</span></div><div class="dash"><b>4</b><span>Unread</span></div><div class="dash"><b>12</b><span>Completed</span></div><div class="dash"><b>3</b><span>Reminders</span></div></div></div></div>`}
function body(){if(S.tab==='chat')return S.chatOpen?chat():contacts();if(S.tab==='tasks')return tasks();if(S.tab==='activity')return activity();if(S.tab==='reminders')return reminders();return settings()}
function render(){const device=document.getElementById('device');device.className='device '+S.dev;const top=`<div class="top"><div class="logo">N</div><div class="toptext"><b>NILTASK</b><span>${S.tab==='chat'&&S.chatOpen?'Leadership':S.tab[0].toUpperCase()+S.tab.slice(1)}</span></div><button class="bell" data-bell>🔔${S.unread?`<span class="badge">${S.unread}</span>`:''}</button></div>`;if(S.dev==='phone'){document.getElementById('screen').innerHTML=`<div class="app"><div class="status"><span>8:37</span><span>● 5G ▰</span></div>${top}<div class="main">${body()}</div>${S.tab==='chat'&&S.chatOpen?composer():''}<div class="bottom">${nav()}</div></div>`}else{document.getElementById('screen').innerHTML=`<div class="rail"><div class="rlogo">N</div>${[['chat','💬','Chat'],['tasks','✅','Tasks'],['activity','🔔','Activity'],['reminders','⏰','Reminders'],['settings','⚙️','Settings']].map(([id,ic,l])=>`<button data-tab="${id}" class="${S.tab===id?'on':''}"><b>${ic}</b>${l}</button>`).join('')}</div><div class="tablet-list">${S.tab==='chat'?contacts():S.tab==='tasks'?tasks():S.tab==='activity'?activity():S.tab==='reminders'?reminders():settings()}</div><div class="tablet-chat"><div class="app">${top}<div class="main">${S.tab==='chat'?chat():`<div class="empty">Select an item on the left. Task management always returns to the original chat message.</div>`}</div>${S.tab==='chat'?composer():''}</div></div>`}bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.chatOpen=S.tab==='chat';render()});document.querySelectorAll('[data-openchat]').forEach(b=>b.onclick=()=>{S.chatOpen=true;S.tab='chat';render()});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{S.chatOpen=false;S.taskMode=false;render()});document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{S.menu=!S.menu;render()});document.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>{S.task=true;S.menu=false;S.taskMode=true;render()});document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{S.taskMode=true;S.action='update';render();setTimeout(()=>document.querySelector('#taskText')?.focus(),0)});document.querySelectorAll('[data-closemode]').forEach(b=>b.onclick=()=>{S.taskMode=false;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{S.action=b.dataset.action;render();setTimeout(()=>document.querySelector('#taskText')?.focus(),0)});document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{let type='UPDATE',text=(document.querySelector('#taskText')?.value||'').trim();if(S.action==='upload'){type='FILE';const f=document.querySelector('#taskFile')?.files?.[0];text=f?f.name+(text?' — '+text:''):(text||'Result_Analysis.xlsx')}if(S.action==='delegate'){type='DELEGATE';const p=document.querySelector('#taskPerson')?.value||'Anita Ma’am';text=`Delegated to ${p}${text?' — '+text:''}`}if(S.action==='transfer'){type='TRANSFER';const p=document.querySelector('#taskPerson')?.value||'Anita Ma’am';text=`Transferred to ${p}${text?' — '+text:''}`}if(S.action==='extension'){type='EXTENSION_REQUEST';const d=document.querySelector('#taskDate')?.value||'15 Aug 2026';text=`Requested deadline ${d}${text?' — '+text:''}`}if(S.action==='submit'){type='SUBMIT';text='Submitted for review'}if(type==='UPDATE'&&!text)text='Progress updated from the chat composer';S.replies.push({who:S.role==='creator'?'Principal':'Ramu Ji',type,text});S.taskMode=false;render();setTimeout(()=>document.querySelector('#taskBubble')?.scrollIntoView({behavior:'smooth',block:'center'}),40)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{S.tab='chat';S.chatOpen=true;S.taskMode=true;S.action='update';render();setTimeout(()=>document.querySelector('#taskBubble')?.classList.add('focus'),20)});document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{b.classList.remove('unread');b.querySelector('.pill')?.remove();if(S.unread>0)S.unread--;setTimeout(render,120)});document.querySelectorAll('[data-bell]').forEach(b=>b.onclick=()=>{S.tab='activity';S.chatOpen=false;render()})}
document.querySelectorAll('#devSeg button').forEach(b=>b.onclick=()=>{S.dev=b.dataset.dev;document.querySelectorAll('#devSeg button').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('#roleSeg button').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;document.querySelectorAll('#roleSeg button').forEach(x=>x.classList.toggle('on',x===b));render()});render();
})();
</script>
</body>
