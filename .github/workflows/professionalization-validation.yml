name: Professionalization Validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate-runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate professionalization contracts
        run: npm run validate:professionalization

      - name: Build and validate local Tailwind CSS
        run: npm run validate:tailwind

      - name: Upload generated Tailwind CSS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-generated-css
          path: css/tailwind.generated.css
          if-no-files-found: warn
          retention-days: 3
