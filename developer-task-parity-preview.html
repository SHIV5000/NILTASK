<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>NILTASK Task Parity Preview</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--ink:#101828;--muted:#667085;--line:#e4e7ec;--bg:#eef1f7;--card:#fff;--accent:#4f46e5;--accent2:#6366f1;--green:#15803d;--red:#b42318;--amber:#b54708;--violet:#7c3aed;--shadow:0 18px 55px rgba(16,24,40,.15)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#e9edff 0,#f7f8fb 38%,#eef2f7 100%);color:var(--ink);min-height:100vh}.page{max-width:1180px;margin:auto;padding:20px}.intro{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.intro h1{font-size:24px;margin:0}.intro p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.safe{display:inline-flex;gap:7px;align-items:center;background:#ecfdf3;border:1px solid #abefc6;color:#067647;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 2px 8px rgba(16,24,40,.04)}.seg button,.reset{border:0;background:transparent;color:#475467;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.seg button.on{background:#eef2ff;color:#3730a3}.reset{background:#fff;border:1px solid var(--line)}
.stage{display:flex;justify-content:center;min-height:680px}.device{background:#101828;border:8px solid #101828;border-radius:32px;box-shadow:var(--shadow);overflow:hidden;transition:width .25s ease,height .25s ease}.device.phone{width:390px;height:760px}.device.tablet{width:min(980px,96vw);height:650px;border-radius:24px}.screen{width:100%;height:100%;background:#f7f8fc;display:flex;overflow:hidden;position:relative}.phone .screen{flex-direction:column}.tablet .screen{flex-direction:row}
.statusbar{height:27px;background:#3730a3;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:10px;font-weight:800}.tablet .statusbar{display:none}.topbar{height:55px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 12px;flex:0 0 auto}.brandmark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#4f46e5,#7c3aed);display:grid;place-items:center;color:#fff;font-size:17px}.topcopy{min-width:0;flex:1}.topcopy strong{display:block;font-size:14px}.topcopy span{display:block;color:var(--muted);font-size:9px;margin-top:2px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:900}.phone-main{flex:1;min-height:0;overflow:auto;padding:12px 12px 84px}.bottomnav{position:absolute;left:0;right:0;bottom:0;height:66px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:max(5px,env(safe-area-inset-bottom))}.bottomnav button{border:0;background:none;color:#667085;font-size:9px;font-weight:800;display:grid;place-items:center;gap:2px;cursor:pointer}.bottomnav button b{font-size:19px;line-height:1}.bottomnav button.on{color:#4338ca}
.rail{width:70px;background:#1f2454;color:#c7d2fe;display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:14px}.rail .rlogo{width:42px;height:42px;border-radius:13px;background:#4f46e5;display:grid;place-items:center;font-size:20px;color:#fff}.rail button{width:52px;border:0;background:transparent;color:#c7d2fe;border-radius:12px;padding:9px 3px;font-size:9px;font-weight:800;cursor:pointer}.rail button b{font-size:18px;display:block;margin-bottom:4px}.rail button.on{background:rgba(255,255,255,.14);color:#fff}.tablet-list{width:320px;background:#f8fafc;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.tablet-list .panehead,.tablet-detail .panehead{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}.panehead strong{font-size:16px}.panehead span{font-size:10px;color:var(--muted)}.tablet-list-body{padding:12px;overflow:auto}.tablet-detail{flex:1;min-width:0;display:flex;flex-direction:column;background:#f7f8fc}.tablet-detail-body{padding:16px;overflow:auto;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 2px 8px rgba(16,24,40,.04);margin-bottom:11px}.taskcard{cursor:pointer;border-left:4px solid #818cf8}.taskcard.active{outline:2px solid #c7d2fe}.eyebrow{font-size:9px;letter-spacing:.07em;font-weight:900;color:#4f46e5;text-transform:uppercase}.title{font-size:15px;font-weight:900;line-height:1.35;margin-top:5px}.meta{font-size:10px;color:var(--muted);line-height:1.45;margin-top:5px}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.between{justify-content:space-between}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:900}.p-await{background:#fff7ed;color:#b54708}.p-ack{background:#eff8ff;color:#175cd3}.p-work{background:#eef2ff;color:#4338ca}.p-review{background:#fdf4ff;color:#a21caf}.p-rework{background:#fef3f2;color:#b42318}.p-done{background:#ecfdf3;color:#067647}.p-high{background:#fef3f2;color:#b42318}.due{font-size:9px;color:#667085;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.stat{background:#f8fafc;border:1px solid #eef2f6;border-radius:10px;text-align:center;padding:8px 4px}.stat strong{display:block;font-size:14px}.stat span{font-size:7px;color:#667085;text-transform:uppercase;font-weight:800}.progress{height:6px;background:#eaecf0;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:#4f46e5;border-radius:99px;width:55%}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:10px 12px;font-size:10px;font-weight:900;cursor:pointer}.btn.primary{background:#4f46e5;color:#fff;flex:1}.btn.secondary{background:#f2f4f7;color:#344054;border:1px solid #e4e7ec}.btn.green{background:#15803d;color:#fff}.btn.red{background:#fff1f0;color:#b42318;border:1px solid #fecdca}.btn.icon{padding:10px 11px}.section-title{font-size:11px;font-weight:900;margin:16px 0 8px;display:flex;align-items:center;gap:6px}.detailhero{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.detailhero h2{font-size:18px;line-height:1.35;margin:5px 0}.notice{background:#eef4ff;border:1px solid #c7d7fe;color:#3538cd;border-radius:12px;padding:10px;font-size:10px;line-height:1.5;margin-bottom:11px}.extension{background:#fffaf0;border:1px solid #fedf89;border-radius:12px;padding:11px}.timeline{border-left:2px solid #d0d5dd;margin-left:8px;padding-left:13px}.event{position:relative;margin:0 0 13px}.event:before{content:'';position:absolute;left:-18px;top:3px;width:8px;height:8px;border-radius:50%;background:#6366f1;border:2px solid #eef2ff}.event strong{display:block;font-size:10px}.event p{margin:2px 0 0;color:#667085;font-size:9px;line-height:1.45}
.chat-message{display:flex;gap:8px;align-items:flex-start}.msgava{width:28px;height:28px;border-radius:50%;background:#fee4e2;color:#b42318;display:grid;place-items:center;font-size:10px;font-weight:900;flex:none}.bubble{flex:1;background:#fff;border:1px solid var(--line);border-radius:6px 16px 16px 16px;padding:10px 11px}.bubblehead{display:flex;justify-content:space-between;gap:8px}.bubblehead strong{font-size:10px}.bubblehead span{font-size:8px;color:#98a2b3}.bubble p{font-size:11px;line-height:1.5;margin:5px 0}.msgactions{display:flex;gap:10px;color:#667085;font-size:8px;font-weight:800;margin-top:7px}.thread{margin:8px 0 0 36px;border-left:2px solid #dbe3f0;padding-left:9px}.reply{display:flex;gap:7px;margin-bottom:8px}.reply .msgava{width:23px;height:23px;background:#eef2ff;color:#4338ca}.reply .bubble{padding:8px 9px;background:#fbfcff}.reply .bubble p{font-size:9px;margin:3px 0}.taskevent{border-left:3px solid #6366f1}.taskevent .eventlabel{color:#4338ca;font-weight:900}.create-hint{margin-top:9px;display:flex;gap:7px}.composer{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;gap:7px;margin-top:14px}.composer span{flex:1;color:#98a2b3;font-size:10px;padding:7px}.composer button{width:32px;height:32px;border:0;border-radius:10px;background:#4f46e5;color:#fff}
.overlay{position:absolute;inset:0;background:rgba(16,24,40,.48);z-index:30;display:none}.overlay.on{display:block}.sheet{position:absolute;background:#fff}.phone .sheet{left:0;right:0;bottom:0;border-radius:24px 24px 0 0;max-height:88%;overflow:auto}.tablet .sheet{right:0;top:0;bottom:0;width:min(440px,70%);overflow:auto}.handle{width:42px;height:4px;border-radius:99px;background:#d0d5dd;margin:9px auto}.sheethead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.sheethead strong{font-size:14px}.close{border:0;width:32px;height:32px;border-radius:50%;background:#f2f4f7;cursor:pointer}.sheetbody{padding:15px}.field{margin-bottom:12px}.field label{display:block;font-size:9px;font-weight:900;margin-bottom:5px;color:#475467}.input{width:100%;border:1px solid #d0d5dd;border-radius:11px;padding:10px;font:inherit;font-size:11px;background:#fff}.check{display:flex;align-items:center;gap:8px;font-size:10px;margin:6px 0}.sheetfoot{display:flex;gap:8px;padding:12px 15px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}.sheetfoot .btn{flex:1}.proof-chip{display:inline-flex;gap:5px;align-items:center;background:#ecfdf3;color:#067647;border-radius:999px;padding:5px 7px;font-size:8px;font-weight:900}
@media(max-width:600px){.page{padding:10px}.intro h1{font-size:19px}.intro p{font-size:11px}.device.phone{height:735px}.controls{justify-content:center}.stage{min-height:750px}}
</style>
</head>
<body>
<div class="page">
  <div class="intro">
    <div><h1>Task Parity Preview</h1><p>Proposed phone + tablet UI using the current Web task rules. Interactions below are a simulation only.</p></div>
    <div class="safe">✓ PREVIEW ONLY · NO DATABASE WRITES</div>
  </div>
  <div class="controls">
    <div class="seg" id="deviceSeg"><button data-device="phone" class="on">📱 Phone</button><button data-device="tablet">▰ Tablet</button></div>
    <div class="seg" id="roleSeg"><button data-role="assignee" class="on">Assignee view</button><button data-role="creator">Creator view</button></div>
    <div class="seg" id="scenarioSeg"><button data-scenario="new">New</button><button data-scenario="working" class="on">Working</button><button data-scenario="submitted">Submitted</button><button data-scenario="extension">Extension</button></div>
    <button class="reset" id="resetBtn">↻ Reset demo</button>
  </div>
  <div class="stage"><div id="device" class="device phone"><div id="screen" class="screen"></div></div></div>
</div>
<script>
(() => {
const S={device:'phone',role:'assignee',view:'tasks',detail:true,scenario:'working',taskCreated:true,status:'in_progress',proof:false,deadline:'12 Aug 2026',extension:null,replies:[]};
const labels={CREATE:'Task created',ACKNOWLEDGE:'Acknowledged',START:'Work started',UPDATE:'Progress update',FILE:'File uploaded',SUBMIT:'Submitted for review',ACCEPT:'Completion accepted',RETURN:'Returned for changes',DELEGATE:'Delegated',TRANSFER:'Transferred',REMINDER:'Reminder sent',DEADLINE:'Deadline changed',EXTENSION_REQUEST:'Deadline extension requested',EXTENSION_APPROVED:'Deadline extension approved',EXTENSION_REJECTED:'Deadline extension declined',CANCEL:'Task cancelled'};
const title='Prepare Class XII Result Analysis & Corrective Plan';
const original='Please prepare the Class XII result analysis, identify weak areas and submit a corrective action plan by 12 August.';
const actor=()=>S.role==='creator'?'Principal':'Ramu Ji';
function seed(scenario=S.scenario){S.replies=[];S.taskCreated=true;S.proof=false;S.extension=null;S.deadline='12 Aug 2026';if(scenario==='new'){S.status='pending_ack';event('CREATE','Assigned to Ramu Ji · Due 12 Aug 2026','Principal',false)}else if(scenario==='working'){S.status='in_progress';event('CREATE','Assigned to Ramu Ji · Due 12 Aug 2026','Principal',false);event('ACKNOWLEDGE','Acknowledged the task','Ramu Ji',false);event('START','Started work','Ramu Ji',false);event('UPDATE','Result data compiled; weak chapters identified.','Ramu Ji',false)}else if(scenario==='submitted'){S.status='submitted';event('CREATE','Assigned to Ramu Ji · Proof required','Principal',false);event('ACKNOWLEDGE','Acknowledged the task','Ramu Ji',false);event('START','Started work','Ramu Ji',false);S.proof=true;event('FILE','result-analysis.pdf','Ramu Ji',false);event('SUBMIT','Submitted for Review','Ramu Ji',false)}else{S.status='in_progress';event('CREATE','Assigned to Ramu Ji · Due 12 Aug 2026','Principal',false);event('ACKNOWLEDGE','Acknowledged the task','Ramu Ji',false);event('START','Started work','Ramu Ji',false);S.extension={date:'16 Aug 2026',reason:'Board moderation data will arrive late.'};event('EXTENSION_REQUEST','Requested deadline 16 Aug 2026 — Board moderation data will arrive late.','Ramu Ji',false)}}
function event(action,comment,who=actor(),rerender=true){S.replies.push({action,label:labels[action]||action,comment,who,time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})});if(rerender)render()}
function statusInfo(){return {pending_ack:['Awaiting Acknowledgement','p-await'],acknowledged:['Acknowledged','p-ack'],in_progress:['In Progress','p-work'],submitted:['Waiting for Review','p-review'],needs_review:['Changes Required','p-rework'],accepted:['Completed','p-done'],transferred:['Transferred','p-await'],cancelled:['Cancelled','p-await']}[S.status]||['In Progress','p-work']}
function phoneTop(){return `<div class="statusbar"><span>8:05</span><span>●●● 97%</span></div><div class="topbar"><div class="brandmark">N</div><div class="topcopy"><strong>NILTASK</strong><span>${S.view==='chat'?'Academic Coordination':S.detail?'Task Detail':'Tasks'}</span></div><div class="avatar">${S.role==='creator'?'P':'R'}</div></div>`}
function nav(){return `<div class="bottomnav"><button data-view="chat" class="${S.view==='chat'?'on':''}"><b>💬</b>Chat</button><button data-view="tasks" class="${S.view==='tasks'?'on':''}"><b>☑</b>Tasks</button><button><b>🔔</b>Activity</button></div>`}
function taskCard(compact=false){const [st,cl]=statusInfo();return `<div class="card taskcard ${S.detail?'active':''}" data-open-detail="1"><div class="row between"><span class="eyebrow">TASK · LINKED TO CHAT</span><span class="pill p-high">HIGH</span></div><div class="title">${title}</div><div class="meta">Created by Principal · 1 assignee</div><div class="row" style="margin-top:9px"><span class="pill ${cl}">${st}</span><span class="due">📅 ${S.deadline}</span>${S.proof?'<span class="proof-chip">✓ Proof</span>':''}</div>${compact?'':`<div class="stats"><div class="stat"><strong>${S.status==='pending_ack'?1:0}</strong><span>Awaiting</span></div><div class="stat"><strong>${['acknowledged','in_progress','needs_review'].includes(S.status)?1:0}</strong><span>Working</span></div><div class="stat"><strong>${S.status==='accepted'?1:0}</strong><span>Completed</span></div></div><div class="progress"><i style="width:${S.status==='accepted'?100:S.status==='pending_ack'?8:S.status==='submitted'?85:55}%"></i></div>`}</div>`}
function assigneeActions(){if(S.status==='pending_ack')return `<div class="actions"><button class="btn primary" data-act="ack">✓ Acknowledge</button><button class="btn secondary" data-act="extension">📅 Extension</button></div>`;if(S.status==='acknowledged')return `<div class="actions"><button class="btn primary" data-act="start">▶ Start Work</button><button class="btn secondary" data-act="extension">📅 Extension</button></div>`;if(['in_progress','needs_review'].includes(S.status))return `<div class="actions"><button class="btn primary" data-act="submit">✈ ${S.status==='needs_review'?'Resubmit':'Submit for Review'}</button><button class="btn secondary icon" data-act="update" title="Progress update">💬</button><button class="btn secondary icon" data-act="proof" title="Upload proof">📎</button><button class="btn secondary icon" data-act="delegate">👤+</button><button class="btn secondary" data-act="extension">📅 Extension</button></div>`;if(S.status==='submitted')return `<div class="actions"><button class="btn secondary" style="flex:1" disabled>⏳ Waiting for Review</button></div>`;return `<div class="notice">🎉 This assignment is complete. The complete trail remains available.</div>`}
function creatorActions(){let review=S.status==='submitted'?`<div class="section-title">📋 Waiting for Your Review</div><div class="card"><strong style="font-size:11px">Ramu Ji</strong><div class="actions"><button class="btn green" data-act="approve">✓ Approve</button><button class="btn secondary" data-act="return">↩ Return</button><button class="btn secondary" data-act="transfer">⇄ Transfer</button></div></div>`:'';let ext=S.extension?`<div class="section-title">📅 Deadline Extension Request</div><div class="extension"><strong style="font-size:11px">Ramu Ji requests ${S.extension.date}</strong><div class="meta">${S.extension.reason}</div><div class="actions"><button class="btn green" data-act="ext-approve">✓ Approve</button><button class="btn red" data-act="ext-decline">✕ Decline</button></div></div>`:'';return `${ext}${review}<div class="section-title">🛠 Creator Controls</div><div class="actions"><button class="btn secondary" data-act="remind">🔔 Remind</button><button class="btn secondary" data-act="deadline">📅 Deadline</button><button class="btn secondary" data-view="chat">💬 Original Message</button><button class="btn secondary">PDF</button><button class="btn red" data-act="cancel">Cancel</button></div>`}
function detail(){const [st,cl]=statusInfo();return `<div class="notice"><b>Parity rule:</b> actions below create one audit-trail event, and that event appears automatically as a reply to the original chat message.</div><div class="detailhero"><div class="eyebrow">LINKED TASK</div><h2>${title}</h2><div class="meta">Created by Principal · Deadline ${S.deadline}</div><div class="row" style="margin-top:10px"><span class="pill ${cl}">${st}</span><span class="pill p-high">HIGH</span>${S.proof?'<span class="proof-chip">✓ Proof uploaded</span>':''}</div>${S.role==='assignee'?assigneeActions():creatorActions()}</div><div class="section-title">👥 Staff Status</div><div class="card row between"><div><strong style="font-size:11px">Ramu Ji</strong><div class="meta">Assignee</div></div><span class="pill ${cl}">${st}</span></div><div class="section-title">🕘 Timeline</div><div class="card"><div class="timeline">${[...S.replies].reverse().map(r=>`<div class="event"><strong>${r.who} · ${r.label}</strong><p>${r.comment||''} · ${r.time}</p></div>`).join('')}</div></div><div class="actions"><button class="btn secondary" data-view="chat">💬 Original Message & replies</button></div>`}
function chat(){return `<div class="card" style="padding:12px"><div class="eyebrow">ACADEMIC COORDINATION</div><div class="meta">Task updates remain in the conversation as replies.</div></div><div class="chat-message"><div class="msgava">P</div><div class="bubble"><div class="bubblehead"><strong>Principal</strong><span>07:42</span></div><p>${original}</p><div class="msgactions"><span>↩ Reply</span><span>🔖 Bookmark</span>${S.taskCreated?'<span>☑ Task linked</span>':'<button class="btn secondary" style="padding:5px 8px" data-act="create">☑ Create Task</button>'}</div></div></div>${S.taskCreated?`<div class="thread">${S.replies.map(r=>`<div class="reply"><div class="msgava">${r.who.charAt(0)}</div><div class="bubble taskevent"><div class="bubblehead"><strong>${r.who}</strong><span>${r.time}</span></div><p><span class="eventlabel">📋 ${r.label}</span>${r.comment?' — '+r.comment:''}</p></div></div>`).join('')}</div><div class="create-hint"><button class="btn secondary" data-view="tasks">☑ Open linked task</button></div>`:''}<div class="composer"><span>Message Academic Coordination…</span><button>➤</button></div>`}
function tabletShell(){const activeTask=S.taskCreated?taskCard(true):`<div class="card"><div class="meta">No task yet. Create one from the original chat message.</div></div>`;return `<div class="rail"><div class="rlogo">N</div><button data-view="chat" class="${S.view==='chat'?'on':''}"><b>💬</b>Chat</button><button data-view="tasks" class="${S.view==='tasks'?'on':''}"><b>☑</b>Tasks</button><button><b>🔔</b>Activity</button></div>${S.view==='tasks'?`<div class="tablet-list"><div class="panehead"><div><strong>Tasks</strong><br><span>Web parity</span></div><span>Filter ▾</span></div><div class="tablet-list-body">${activeTask}</div></div><div class="tablet-detail"><div class="panehead"><div><strong>Task Detail</strong><br><span>${S.role==='creator'?'Creator':'Assignee'} view</span></div><span>⋯</span></div><div class="tablet-detail-body">${S.taskCreated?detail():'<div class="notice">Create a task from Chat to see the full workflow.</div>'}</div></div>`:`<div class="tablet-list"><div class="panehead"><div><strong>Chats</strong><br><span>1 active group</span></div></div><div class="tablet-list-body"><div class="card taskcard active"><strong style="font-size:12px">Academic Coordination</strong><div class="meta">Principal: Please prepare Class XII…</div></div></div></div><div class="tablet-detail"><div class="panehead"><div><strong>Academic Coordination</strong><br><span>Original message + task replies</span></div><span>⋯</span></div><div class="tablet-detail-body">${chat()}</div></div>`}`}
function phoneShell(){return `${phoneTop()}<div class="phone-main">${S.view==='chat'?chat():S.detail&&S.taskCreated?detail():S.taskCreated?taskCard():`<div class="notice">No task yet. Open Chat and create a task from the message.</div>`}</div>${nav()}`}
function render(){const d=document.getElementById('device');d.className='device '+S.device;document.getElementById('screen').innerHTML=S.device==='phone'?phoneShell():tabletShell();bind()}
function sheet(titleText,body,primary,cb){const scr=document.getElementById('screen');scr.insertAdjacentHTML('beforeend',`<div class="overlay on" id="ov"><div class="sheet"><div class="handle"></div><div class="sheethead"><strong>${titleText}</strong><button class="close" data-close="1">✕</button></div><div class="sheetbody">${body}</div><div class="sheetfoot"><button class="btn secondary" data-close="1">Cancel</button><button class="btn primary" id="sheetPrimary">${primary}</button></div></div></div>`);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById('ov')?.remove());document.getElementById('sheetPrimary').onclick=()=>{cb();document.getElementById('ov')?.remove();render()}}
function createSheet(){sheet('Create Task from Message',`<div class="notice">Source message is linked automatically. Every later task event will return to this thread as a reply.</div><div class="field"><label>Task title</label><input class="input" id="fTitle" value="${title}"></div><div class="field"><label>Assignees</label><label class="check"><input type="checkbox" checked> Ramu Ji</label><label class="check"><input type="checkbox"> Seema</label></div><div class="field"><label>Deadline</label><input class="input" type="date" value="2026-08-12"></div><div class="field"><label>Priority</label><select class="input"><option>Normal</option><option selected>High</option><option>Low</option></select></div><label class="check"><input id="fProof" type="checkbox"> Require proof before submission</label>`,'Create Task',()=>{S.taskCreated=true;S.status='pending_ack';S.proof=false;S.replies=[];event('CREATE','Assigned to Ramu Ji · Due 12 Aug 2026','Principal',false);S.view='tasks';S.detail=true})}
function updateSheet(){sheet('Progress Update',`<div class="field"><label>What progress has been made?</label><textarea class="input" id="upText" rows="5">Result analysis completed; corrective actions drafted.</textarea></div>`,'Post Update',()=>event('UPDATE',document.getElementById('upText')?.value||'Progress updated',undefined,false))}
function extensionSheet(){sheet('Request Deadline Extension',`<div class="field"><label>Requested deadline</label><input class="input" id="exDate" type="date" value="2026-08-16"></div><div class="field"><label>Reason</label><textarea class="input" id="exReason" rows="4">Board moderation data will arrive late.</textarea></div>`,'Send Request',()=>{S.extension={date:'16 Aug 2026',reason:document.getElementById('exReason')?.value||''};event('EXTENSION_REQUEST','Requested deadline 16 Aug 2026 — '+S.extension.reason,undefined,false)})}
function returnSheet(){sheet('Return for Changes',`<div class="field"><label>Feedback</label><textarea class="input" id="retText" rows="4">Please add section-wise comparison and corrective dates.</textarea></div>`,'Return Task',()=>{S.status='needs_review';event('RETURN',document.getElementById('retText')?.value||'Changes required','Principal',false)})}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;if(S.view==='tasks')S.detail=true;render()});document.querySelectorAll('[data-open-detail]').forEach(b=>b.onclick=()=>{S.view='tasks';S.detail=true;render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.dataset.act)})}
function act(a){if(a==='create')return createSheet();if(a==='ack'){S.status='acknowledged';event('ACKNOWLEDGE','Acknowledged the task');return}if(a==='start'){S.status='in_progress';event('START','Started work');return}if(a==='update')return updateSheet();if(a==='proof'){S.proof=true;event('FILE','result-analysis.pdf');return}if(a==='delegate'){event('DELEGATE','Delegated supporting data collection to Seema');return}if(a==='extension')return extensionSheet();if(a==='submit'){if(!S.proof&&S.scenario==='submitted'){alert('Proof is required before submission.');return}S.status='submitted';event('SUBMIT','Submitted for Review');return}if(a==='approve'){S.status='accepted';event('ACCEPT','Completion accepted','Principal');return}if(a==='return')return returnSheet();if(a==='transfer'){S.status='transferred';event('TRANSFER','Ramu Ji → Seema — reassigned by creator','Principal');return}if(a==='ext-approve'){S.deadline=S.extension?.date||S.deadline;S.extension=null;event('EXTENSION_APPROVED','Deadline extended to '+S.deadline,'Principal');return}if(a==='ext-decline'){S.extension=null;event('EXTENSION_REJECTED','Deadline extension declined','Principal');return}if(a==='remind'){event('REMINDER','Reminder sent to Ramu Ji','Principal');return}if(a==='deadline'){S.deadline='14 Aug 2026';event('DEADLINE','Deadline changed to 14 Aug 2026 — revised schedule','Principal');return}if(a==='cancel'){S.status='cancelled';event('CANCEL','Task cancelled — history preserved','Principal');return}}
document.getElementById('deviceSeg').onclick=e=>{const b=e.target.closest('button[data-device]');if(!b)return;S.device=b.dataset.device;document.querySelectorAll('#deviceSeg button').forEach(x=>x.classList.toggle('on',x===b));render()};document.getElementById('roleSeg').onclick=e=>{const b=e.target.closest('button[data-role]');if(!b)return;S.role=b.dataset.role;document.querySelectorAll('#roleSeg button').forEach(x=>x.classList.toggle('on',x===b));render()};document.getElementById('scenarioSeg').onclick=e=>{const b=e.target.closest('button[data-scenario]');if(!b)return;S.scenario=b.dataset.scenario;document.querySelectorAll('#scenarioSeg button').forEach(x=>x.classList.toggle('on',x===b));seed();render()};document.getElementById('resetBtn').onclick=()=>{S.taskCreated=false;S.replies=[];S.status='pending_ack';S.extension=null;S.proof=false;S.view='chat';S.detail=false;render()};seed('working');render();
})();
</script>
</body>
</html>
